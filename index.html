        document.open(); document.write(html); document.close();
        var t=html.match(/<title>([^<]*)<\/title>/);   // 環境によりtitleが残るためフォールバック
        if(t) document.title=t[1];
      })
      .catch(fail);
  }
  function fail(){
    busy=false;
    document.getElementById("spin").style.display="none";
    document.getElementById("err").textContent="…その合言葉では開かないようです。";
  }
  document.getElementById("go").addEventListener("click",function(){
    tryKey(document.getElementById("k").value.trim());
  });
  document.getElementById("k").addEventListener("keydown",function(e){
    if(e.key==="Enter")tryKey(this.value.trim());
  });
  function fromHash(){
    var m=location.hash.match(/[#&]k=([^&]+)/);
    if(m) tryKey(decodeURIComponent(m[1]));
  }
  addEventListener("hashchange",fromHash);
  fromHash();
})();
</script>
</body>
</html>
