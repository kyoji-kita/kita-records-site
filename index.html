<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(90% 70% at 50% 30%,#0c1410,#05080a 70%);color:#f1f5f2;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center}
  .door{padding:32px 24px;max-width:420px}
  .vinyl{width:110px;height:110px;border-radius:50%;margin:0 auto 26px;position:relative;
    background:repeating-radial-gradient(circle at 50% 50%,rgba(255,255,255,.05) 0 1px,transparent 1px 4px),
      radial-gradient(circle at 50% 50%,#101211,#000 82%);
    box-shadow:0 18px 50px rgba(0,0,0,.7),0 0 40px rgba(30,215,96,.12);animation:spin 9s linear infinite}
  .vinyl::after{content:"";position:absolute;left:50%;top:50%;width:42px;height:42px;border-radius:50%;
    transform:translate(-50%,-50%);background:linear-gradient(150deg,#4fe387,#149a46)}

  h1{font-size:22px;font-weight:900;letter-spacing:.06em;color:#dffbe9;
    text-shadow:0 0 10px rgba(30,215,96,.7),0 0 30px rgba(30,215,96,.4)}
  h1 span{color:#1ed760}
  .sub{margin:12px 0 6px;color:#a8b3ab;font-size:14px;line-height:1.8}
  .note{font-family:ui-monospace,Menlo,monospace;font-size:10.5px;letter-spacing:.14em;color:#5c665f;margin-bottom:22px}
  .row{display:flex;gap:8px;justify-content:center}
  input{background:#0d1411;border:1px solid #20302a;border-radius:9px;color:#f1f5f2;
    font-family:ui-monospace,Menlo,monospace;font-size:13px;padding:11px 14px;width:220px;outline:none;text-align:center}
  input:focus{border-color:#1db954}
  button{background:#1db954;color:#04110a;border:none;border-radius:9px;font-weight:700;
    font-size:13px;padding:11px 18px;cursor:pointer;font-family:inherit}
  button:hover{background:#1ed760}
  .err{color:#e8b04b;font-size:12.5px;margin-top:12px;min-height:1.4em}
  .spin{color:#8b978f;font-size:13px;margin-top:14px;display:none}
</style>

  function b64ToBytes(s){ var bin=atob(s), a=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; }
  function b64urlToBytes(s){ s=s.replace(/-/g,"+").replace(/_/g,"/");
    while(s.length%4)s+="="; return b64ToBytes(s); }

  function tryKey(k){
    if(busy||!k)return; busy=true;
