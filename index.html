<style>

  .row{display:flex;gap:8px;justify-content:center}

  input:focus{border-color:#1db954}

  function b64ToBytes(s){ var bin=atob(s), a=new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; }
  var busy=false;
  function tryKey(k){
    if(busy||!k)return; busy=true;
    document.getElementById("spin").style.display="block";
    document.getElementById("err").textContent="";
    crypto.subtle.importKey("raw",new TextEncoder().encode(k),"PBKDF2",false,["deriveKey"])
      .then(function(bk){ return crypto.subtle.deriveKey(
